<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JROTC Board Study Guide</title>
  <!-- FontAwesome Icons for Military UI Badges -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --army-green: #3B5323;
      --army-green-dark: #273817;
      --army-gold: #D4AF37;
      --army-gold-hover: #b89528;
      --army-black: #111111;
      --army-tan: #C2B280;
      --army-tan-light: #F4F1EA;
      --bg: #ecefe8;
      --card-bg: #ffffff;
      --text: #1a2213;
      --text-muted: #526043;
      --border-color: #cbd5c0;
      --shadow: rgba(17, 17, 17, 0.15);
      --success: #2e7d32;
      --warning: #c62828;
      --input-bg: #ffffff;
      --camo-pattern: repeating-linear-gradient(45deg, #3b5323 0, #3b5323 15px, #273817 15px, #273817 30px, #4d3826 30px, #4d3826 45px, #606d42 45px, #606d42 60px);
    }

    [data-theme="dark"] {
      --bg: #0d120a;
      --card-bg: #161e12;
      --text: #f0f4ec;
      --text-muted: #94a385;
      --border-color: #2c3a21;
      --shadow: rgba(0, 0, 0, 0.6);
      --input-bg: #1a2515;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }

    header {
      width: 100%;
      max-width: 800px;
      margin-bottom: 20px;
      position: relative;
      background: var(--card-bg);
      border-radius: 12px;
      border: 2px solid var(--army-gold);
      box-shadow: 0 6px 16px var(--shadow);
      overflow: hidden;
    }

    .camo-bar {
      height: 10px;
      background: var(--camo-pattern);
      width: 100%;
    }

    .header-content {
      padding: 16px 20px;
      text-align: center;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 1.8rem;
      color: var(--army-green);
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    [data-theme="dark"] h1 {
      color: var(--army-gold);
    }

    p.subtitle {
      font-size: 0.95rem;
      color: var(--text-muted);
      font-weight: 600;
      margin-top: 2px;
    }

    .icon-btn {
      background: var(--card-bg);
      border: 1.5px solid var(--border-color);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 2px 4px var(--shadow);
      transition: all 0.2s ease;
    }

    .icon-btn:hover {
      border-color: var(--army-gold);
      color: var(--army-gold);
    }

    .app-tabs {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 800px;
      margin-bottom: 15px;
    }

    .tab-btn {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      background-color: var(--card-bg);
      border: 2px solid var(--border-color);
      color: var(--text-muted);
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background-color: var(--army-green);
      color: #ffffff;
      border-color: var(--army-gold);
      box-shadow: 0 4px 10px var(--shadow);
    }

    /* Controls Grid */
    .controls-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 800px;
      width: 100%;
      margin-bottom: 15px;
    }

    .search-filter-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .search-box {
      position: relative;
      flex: 1;
      min-width: 220px;
    }

    .search-box i {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    .search-box input {
      width: 100%;
      padding: 10px 12px 10px 36px;
      border-radius: 8px;
      border: 1.5px solid var(--border-color);
      background-color: var(--input-bg);
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
    }

    .search-box input:focus {
      border-color: var(--army-gold);
    }

    select, button {
      padding: 10px 14px;
      border: 1.5px solid var(--border-color);
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 2px 4px var(--shadow);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    select {
      background-color: var(--input-bg);
      color: var(--text);
      flex: 1;
      min-width: 220px;
    }

    button.btn-army {
      background-color: var(--army-green);
      color: #ffffff;
      border: 1px solid var(--army-gold);
    }

    button.btn-army:hover {
      background-color: var(--army-green-dark);
    }

    button.btn-gold {
      background-color: var(--army-gold);
      color: var(--army-black);
      border: none;
    }

    button.btn-gold:hover {
      background-color: var(--army-gold-hover);
    }

    .filter-pills {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .pill {
      padding: 6px 14px;
      border-radius: 16px;
      font-size: 0.8rem;
      font-weight: 700;
      background: var(--card-bg);
      border: 1.5px solid var(--border-color);
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
    }

    .pill.active {
      background: var(--army-gold);
      color: var(--army-black);
      border-color: var(--army-gold);
    }

    .stats-bar {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 800px;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .progress-bar-container {
      width: 100%;
      max-width: 800px;
      background-color: var(--border-color);
      border-radius: 10px;
      height: 10px;
      overflow: hidden;
      margin-bottom: 15px;
      border: 1px solid var(--border-color);
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--army-green), var(--army-gold));
      transition: width 0.3s ease;
    }

    .scene {
      width: 100%;
      max-width: 800px;
      height: 420px;
      perspective: 1000px;
      cursor: pointer;
    }

    .card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: 16px;
      box-shadow: 0 10px 25px var(--shadow);
    }

    .card.is-flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
      background-color: var(--card-bg);
      border: 2px solid var(--border-color);
    }

    .card-front {
      border-top: 8px solid var(--army-green);
    }

    .card-back {
      transform: rotateY(180deg);
      border-top: 8px solid var(--army-gold);
    }

    .card-header-tools {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    .category-tag {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 4px 12px;
      border-radius: 12px;
      background-color: rgba(59, 83, 35, 0.15);
      color: var(--army-green);
      font-weight: 800;
      border: 1px solid rgba(59, 83, 35, 0.3);
    }

    [data-theme="dark"] .category-tag {
      color: var(--army-gold);
      background-color: rgba(212, 175, 55, 0.15);
      border-color: rgba(212, 175, 55, 0.3);
    }

    .speak-btn {
      background: none;
      border: none;
      box-shadow: none;
      color: var(--text-muted);
      font-size: 1.2rem;
      padding: 4px 8px;
      cursor: pointer;
    }

    .speak-btn:hover {
      color: var(--army-gold);
    }

    .card-content {
      font-size: 1.25rem;
      line-height: 1.6;
      color: var(--text);
      margin: auto 0;
      overflow-y: auto;
      max-height: 250px;
      padding: 0 10px;
      width: 100%;
      font-weight: 600;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .rank-graphic {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 8px auto;
      background: rgba(0, 0, 0, 0.04);
      padding: 10px 20px;
      border-radius: 12px;
      border: 1.5px dashed var(--army-gold);
      max-width: 300px;
    }

    [data-theme="dark"] .rank-graphic {
      background: rgba(255, 255, 255, 0.04);
    }

    .rank-svg {
      filter: drop-shadow(0px 3px 5px rgba(0,0,0,0.3));
    }

    .rank-badge-svg {
      filter: drop-shadow(0px 3px 6px rgba(0,0,0,0.35));
      max-height: 135px;
      width: auto;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    .hint {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-style: italic;
    }

    .mastery-controls {
      display: flex;
      gap: 12px;
      margin-top: 15px;
      width: 100%;
      max-width: 800px;
      justify-content: center;
    }

    .btn-mastery {
      flex: 1;
      max-width: 220px;
      padding: 12px 14px;
      border-radius: 8px;
      font-weight: 700;
    }

    .btn-known {
      background-color: transparent;
      border: 2px solid var(--success);
      color: var(--success);
    }

    .btn-known.active, .btn-known:hover {
      background-color: var(--success);
      color: #ffffff;
    }

    .btn-practice {
      background-color: transparent;
      border: 2px solid var(--warning);
      color: var(--warning);
    }

    .btn-practice.active, .btn-practice:hover {
      background-color: var(--warning);
      color: #ffffff;
    }

    .nav-controls {
      display: flex;
      gap: 15px;
      margin-top: 15px;
    }

    .nav-controls button {
      padding: 10px 24px;
      font-size: 1rem;
    }

    #quizView {
      display: none;
      width: 100%;
      max-width: 800px;
    }

    .quiz-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 24px;
      border: 2px solid var(--border-color);
      box-shadow: 0 10px 25px var(--shadow);
      margin-bottom: 15px;
    }

    .quiz-question {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 20px;
      color: var(--text);
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-btn {
      width: 100%;
      text-align: left;
      padding: 14px 18px;
      border-radius: 10px;
      border: 2px solid var(--border-color);
      background: var(--input-bg);
      color: var(--text);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      transition: all 0.2s ease;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--army-gold);
      background: rgba(212, 175, 55, 0.08);
    }

    .option-btn.correct {
      background-color: rgba(46, 125, 50, 0.2) !important;
      border-color: var(--success) !important;
      color: var(--success) !important;
    }

    .option-btn.incorrect {
      background-color: rgba(198, 40, 40, 0.2) !important;
      border-color: var(--warning) !important;
      color: var(--warning) !important;
    }

    .quiz-summary {
      text-align: center;
      padding: 30px 20px;
    }

    .score-badge {
      font-size: 3rem;
      font-weight: 800;
      color: var(--army-gold);
      margin: 15px 0;
    }

    .rank-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--army-green);
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    [data-theme="dark"] .rank-title {
      color: var(--army-gold);
    }

    /* Modal Styling */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      padding: 15px;
    }

    .modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 24px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      border: 2px solid var(--army-gold);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .modal-title {
      font-size: 1.25rem;
      font-weight: bold;
      color: var(--text);
    }

    .modal-close {
      background: none;
      border: none;
      font-size: 1.2rem;
      color: var(--text-muted);
      cursor: pointer;
      box-shadow: none;
    }

    .form-group {
      margin-bottom: 14px;
      text-align: left;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 4px;
      color: var(--text);
    }

    .form-group input, .form-group textarea, .form-group select {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1.5px solid var(--border-color);
      background: var(--input-bg);
      color: var(--text);
      font-size: 0.9rem;
    }

    .form-group textarea {
      resize: vertical;
      min-height: 80px;
    }

    @media (max-width: 600px) {
      .scene { height: 440px; }
      .card-content { font-size: 1.1rem; }
      .search-filter-row { flex-direction: column; }
    }
  </style>
</head>
<body>

  <!-- Header Banner -->
  <header>
    <div class="camo-bar"></div>
    <div class="header-content">
      <div class="top-bar">
        <button class="icon-btn" onclick="toggleTheme()" id="themeToggleBtn">
          <i class="fa-solid fa-moon"></i> <span>Dark Mode</span>
        </button>
      </div>
      <h1><i class="fa-solid fa-shield-halved"></i> Lobo Battalion JROTC</h1>
      <p class="subtitle">Cadet & Junior Leader Board Study Guide</p>
    </div>
  </header>

  <!-- Navigation Tabs -->
  <div class="app-tabs">
    <button class="tab-btn active" id="flashcardTabBtn" onclick="switchMode('flashcard')">
      <i class="fa-solid fa-layer-group"></i> Flashcard Mode
    </button>
    <button class="tab-btn" id="quizTabBtn" onclick="switchMode('quiz')">
      <i class="fa-solid fa-file-pen"></i> Self Quiz Mode
    </button>
  </div>

  <!-- Global Filter & Search Controls -->
  <div class="controls-grid">
    <div class="search-filter-row">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" placeholder="Search cadet material..." oninput="handleSearch()">
      </div>
      <select id="sectionSelect" onchange="applyFilters()">
        <option value="ALL">All Sections (85 Cards)</option>
        <option value="1">Section 1: General Knowledge</option>
        <option value="2">Section 2: Leadership</option>
        <option value="3">Section 3: Drill & Ceremonies</option>
        <option value="4">Section 4: First Aid & Health</option>
        <option value="5">Section 5: Chain of Command & Government</option>
        <option value="6">Section 6: Military Customs & Courtesies</option>
        <option value="7">Section 7: Military History & Civics</option>
        <option value="8">Section 8: Physical Fitness & PRT</option>
        <option value="9">Section 9: Uniform & Appearance Standards</option>
        <option value="10">Section 10: Visual Rank Insignia</option>
      </select>
    </div>

    <div class="filter-pills" id="flashcardPills">
      <div class="pill active" id="filterAll" onclick="setMasteryFilter('ALL')">All Cards</div>
      <div class="pill" id="filterPractice" onclick="setMasteryFilter('PRACTICE')">Needs Practice</div>
      <div class="pill" id="filterMastered" onclick="setMasteryFilter('MASTERED')">Mastered</div>
      <button class="btn-gold" style="padding: 4px 12px; margin-left: auto; font-size: 0.8rem;" onclick="shuffleCards()">
        <i class="fa-solid fa-shuffle"></i> Shuffle
      </button>
      <button class="btn-army" style="padding: 4px 12px; font-size: 0.8rem;" onclick="resetDeck()">
        <i class="fa-solid fa-rotate-left"></i> Reset
      </button>
    </div>
  </div>

  <div class="stats-bar">
    <span id="cardCounter">Card 1 of 85</span>
    <span id="masteryStats">Mastered: 0 | Practice: 0</span>
  </div>

  <div class="progress-bar-container">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <div id="flashcardView" style="width: 100%; max-width: 800px; display: flex; flex-direction: column; align-items: center;">
    <div class="scene" onclick="flipCard()">
      <div class="card" id="flashcard">
        <div class="card-face card-front">
          <div class="card-header-tools">
            <span class="category-tag" id="cardCategory">Category</span>
            <button class="speak-btn" onclick="event.stopPropagation(); speakCardText('front')" title="Listen to question">
              <i class="fa-solid fa-volume-high"></i>
            </button>
          </div>
          <div class="card-content" id="cardQuestion">Question content...</div>
          <div class="card-footer">
            <span class="hint"><i class="fa-solid fa-hand-pointer"></i> Click or Press Space to Flip</span>
          </div>
        </div>
        <div class="card-face card-back">
          <div class="card-header-tools">
            <span class="category-tag" style="background-color: rgba(212, 175, 55, 0.15); color: var(--army-gold);">Answer</span>
            <button class="speak-btn" onclick="event.stopPropagation(); speakCardText('back')" title="Listen to answer">
              <i class="fa-solid fa-volume-high"></i>
            </button>
          </div>
          <div class="card-content" id="cardAnswer">Answer content...</div>
          <div class="card-footer">
            <span class="hint"><i class="fa-solid fa-hand-pointer"></i> Click or Press Space to Flip</span>
          </div>
        </div>
      </div>
    </div>

    <div class="mastery-controls">
      <button class="btn-mastery btn-practice" id="btnPractice" onclick="setCardStatus(false)">
        <i class="fa-solid fa-xmark"></i> Needs Practice
      </button>
      <button class="btn-mastery btn-known" id="btnKnown" onclick="setCardStatus(true)">
        <i class="fa-solid fa-check"></i> Mastered
      </button>
    </div>

    <div class="nav-controls">
      <button onclick="prevCard()"><i class="fa-solid fa-arrow-left"></i> Previous</button>
      <button onclick="nextCard()">Next <i class="fa-solid fa-arrow-right"></i></button>
    </div>
  </div>

  <div id="quizView">
    <div class="quiz-card" id="quizContainer">
      <!-- Quiz Question or Score Summary injected dynamically -->
    </div>
    <div class="nav-controls" style="justify-content: center;" id="quizNavControls">
      <button class="btn-gold" id="nextQuizBtn" onclick="nextQuizQuestion()" style="display: none;">
        Next Question <i class="fa-solid fa-arrow-right"></i>
      </button>
    </div>
  </div>

  <!-- Custom Card Modal -->
  <div class="modal-overlay" id="addCardModal">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title"><i class="fa-solid fa-pen-to-square"></i> Create Custom Flashcard</h3>
        <button class="modal-close" onclick="closeAddModal()"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <form onsubmit="saveCustomCard(event)">
        <div class="form-group">
          <label>Section Assignment</label>
          <select id="newSectionSelect" required>
            <option value="1">Section 1: General Knowledge</option>
            <option value="2">Section 2: Leadership</option>
            <option value="3">Section 3: Drill & Ceremonies</option>
            <option value="4">Section 4: First Aid & Health</option>
            <option value="5">Section 5: Chain of Command</option>
            <option value="6">Section 6: Customs & Courtesies</option>
            <option value="7">Section 7: History & Civics</option>
            <option value="8">Section 8: Fitness & PRT</option>
            <option value="9">Section 9: Uniform Standards</option>
            <option value="10">Section 10: Ranks</option>
          </select>
        </div>
        <div class="form-group">
          <label>Category Tag</label>
          <input type="text" id="newCategory" placeholder="e.g. Battalion Customs" required>
        </div>
        <div class="form-group">
          <label>Question</label>
          <textarea id="newQuestion" placeholder="Enter question..." required></textarea>
        </div>
        <div class="form-group">
          <label>Answer</label>
          <textarea id="newAnswer" placeholder="Enter answer..." required></textarea>
        </div>
        <button type="submit" class="btn-gold" style="width: 100%; margin-top: 10px;">
          <i class="fa-solid fa-floppy-disk"></i> Save Flashcard
        </button>
      </form>
    </div>
  </div>

  <script>
    // High-definition SVG Officer Rank Graphic Generator
    function renderOfficerGraphics(type, count) {
      let svgs = '';
      for (let i = 0; i < count; i++) {
        if (type === 'diamond') {
          svgs += `
            <svg class="rank-svg" viewBox="0 0 40 40" width="42" height="42">
              <polygon points="20,2 38,20 20,38 2,20" fill="url(#badgeGold)" stroke="#111" stroke-width="1.5"/>
              <polygon points="20,8 32,20 20,32 8,20" fill="none" stroke="#FFF0A5" stroke-width="1" opacity="0.7"/>
            </svg>`;
        } else if (type === 'disk') {
          svgs += `
            <svg class="rank-svg" viewBox="0 0 40 40" width="40" height="40">
              <circle cx="20" cy="20" r="16" fill="url(#badgeGold)" stroke="#111" stroke-width="1.5"/>
              <circle cx="20" cy="20" r="11" fill="none" stroke="#FFF0A5" stroke-width="1" opacity="0.7"/>
            </svg>`;
        }
      }

      const gradientDef = `
        <svg width="0" height="0" style="position:absolute;">
          <defs>
            <linearGradient id="badgeGold" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#FFE57F"/>
              <stop offset="50%" stop-color="#D4AF37"/>
              <stop offset="100%" stop-color="#8A6D11"/>
            </linearGradient>
          </defs>
        </svg>`;

      return `<div class="rank-graphic">${gradientDef}${svgs}</div>`;
    }

    // High-definition Single-Badge Enlisted Cadet Rank SVG Generator
    function renderEnlistedBadge(chevrons, bars, centerIcon = null) {
      const svgWidth = 90;
      const baseHeight = 120;
      let paths = '';

      const defs = `
        <defs>
          <linearGradient id="badgeGold" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFE57F"/>
            <stop offset="50%" stop-color="#D4AF37"/>
            <stop offset="100%" stop-color="#8A6D11"/>
          </linearGradient>
          <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000" flood-opacity="0.4"/>
          </filter>
        </defs>`;

      // Chevrons (pointing upwards)
      for (let i = 0; i < chevrons; i++) {
        const yOffset = i * 13;
        paths += `<path d="M 12,${30 + yOffset} L 45,10 L 78,${30 + yOffset} L 78,${20 + yOffset} L 45,0 L 12,${20 + yOffset} Z" fill="url(#badgeGold)" stroke="#111" stroke-width="1.2" filter="url(#shadow)"/>`;
      }

      // Center Emblem
      const centerY = chevrons * 13 + 12;
      if (centerIcon === 'diamond') {
        paths += `<polygon points="45,${centerY - 8} 53,${centerY} 45,${centerY + 8} 37,${centerY}" fill="url(#badgeGold)" stroke="#111" stroke-width="1.2"/>`;
      } else if (centerIcon === 'star') {
        paths += `<polygon points="45,${centerY - 8} 47,${centerY - 2} 53,${centerY - 2} 48,${centerY + 2} 50,${centerY + 8} 45,${centerY + 4} 40,${centerY + 8} 42,${centerY + 2} 37,${centerY - 2} 43,${centerY - 2}" fill="url(#badgeGold)" stroke="#111" stroke-width="1"/>`;
      } else if (centerIcon === 'csm') {
        paths += `<circle cx="45" cy="${centerY}" r="10" fill="none" stroke="url(#badgeGold)" stroke-width="2.2" stroke-dasharray="3.5,1.5"/>`;
        paths += `<polygon points="45,${centerY - 6} 47,${centerY - 1} 52,${centerY - 1} 48,${centerY + 2} 50,${centerY + 7} 45,${centerY + 4} 40,${centerY + 7} 42,${centerY + 2} 38,${centerY - 1} 43,${centerY - 1}" fill="url(#badgeGold)" stroke="#111" stroke-width="0.8"/>`;
      }

      // Bars (rocker stripes below)
      const barStartY = centerY + (centerIcon ? 14 : 4);
      for (let j = 0; j < bars; j++) {
        const y = barStartY + (j * 9);
        paths += `<path d="M 16,${y} Q 45,${y + 8} 74,${y} L 74,${y + 6} Q 45,${y + 14} 16,${y + 6} Z" fill="url(#badgeGold)" stroke="#111" stroke-width="1.2" filter="url(#shadow)"/>`;
      }

      const totalHeight = Math.max(baseHeight, barStartY + bars * 9 + 12);

      return `
        <div class="rank-graphic">
          <svg class="rank-badge-svg" viewBox="0 0 90 ${totalHeight}" width="90" height="${totalHeight}">
            ${defs}
            ${paths}
          </svg>
        </div>`;
    }

      // Section 10: Visual Rank Insignia

      { id: "s10_2", section: "10", cat: "Officer Ranks", q: "Identify Officer Rank: Two Diamonds" + renderOfficerGraphics('diamond', 2), a: "Lieutenant Colonel (c/LTC)", distractors: ["Colonel (c/COL)", "Major (c/MAJ)", "First Lieutenant (c/1LT)"] },

      { id: "s10_7", section: "10", cat: "Enlisted Ranks", q: "Identify Enlisted Rank: Three Chevrons / three stripes, a star and a wreath" + renderEnlistedBadge(3, 3, 'csm'), a: "Command Sergeant Major (c/CSM)", distractors: ["Sergeant Major (c/SGM)", "First Sergeant (c/1SG)", "Master Sergeant (c/MSG)"] },
      { id: "s10_8", section: "10", cat: "Enlisted Ranks", q: "Identify Enlisted Rank: Three Chevrons / three stripes and a star" + renderEnlistedBadge(3, 3, 'star'), a: "Sergeant Major (c/SGM)", distractors: ["Command Sergeant Major (c/CSM)", "First Sergeant (c/1SG)", "Staff Sergeant (c/SSG)"] },
      { id: "s10_9", section: "10", cat: "Enlisted Ranks", q: "Identify Enlisted Rank: Three Chevrons / three stripes and a diamond" + renderEnlistedBadge(3, 3, 'diamond'), a: "First Sergeant (c/1SG)", distractors: ["Master Sergeant (c/MSG)", "Sergeant Major (c/SGM)", "Sergeant First Class (c/SFC)"] },
      { id: "s10_10", section: "10", cat: "Enlisted Ranks", q: "Identify Enlisted Rank: Three Chevrons / three stripes" + renderEnlistedBadge(3, 3, null), a: "Master Sergeant (c/MSG)", distractors: ["First Sergeant (c/1SG)", "Sergeant First Class (c/SFC)", "Staff Sergeant (c/SSG)"] },
      { id: "s10_11", section: "10", cat: "Enlisted Ranks", q: "Identify Enlisted Rank: Three Chevrons / two stripes" + renderEnlistedBadge(3, 2, null), a: "Sergeant First Class (c/SFC)", distractors: ["Staff Sergeant (c/SSG)", "Master Sergeant (c/MSG)", "Sergeant (c/SGT)"] },
      { id: "s10_12", section: "10", cat: "Enlisted Ranks", q: "Identify Enlisted Rank: Three Chevrons / one stripe" + renderEnlistedBadge(3, 1, null), a: "Staff Sergeant (c/SSG)", distractors: ["Sergeant (c/SGT)", "Sergeant First Class (c/SFC)", "Corporal (c/CPL)"] },
      { id: "s10_13", section: "10", cat: "Enlisted Ranks", q: "Identify Enlisted Rank: Three Chevrons" + renderEnlistedBadge(3, 0, null), a: "Sergeant (c/SGT)", distractors: ["Corporal (c/CPL)", "Staff Sergeant (c/SSG)", "Private First Class (c/PFC)"] },
      { id: "s10_14", section: "10", cat: "Enlisted Ranks", q: "Identify Enlisted Rank: Two Chevrons" + renderEnlistedBadge(2, 0, null), a: "Corporal (c/CPL)", distractors: ["Sergeant (c/SGT)", "Private First Class (c/PFC)", "Private (c/PV2)"] },
      { id: "s10_15", section: "10", cat: "Enlisted Ranks", q: "Identify Enlisted Rank: One Chevron / one stripe" + renderEnlistedBadge(1, 1, null), a: "Private First Class (c/PFC)", distractors: ["Private (c/PV2)", "Corporal (c/CPL)", "Sergeant (c/SGT)"] },
      { id: "s10_16", section: "10", cat: "Enlisted Ranks", q: "Identify Enlisted Rank: One Chevron" + renderEnlistedBadge(1, 0, null), a: "Private (c/PV2)", distractors: ["Private First Class (c/PFC)", "Corporal (c/CPL)", "Basic Private"] }
    ];

    let allCards = [];
    let currentDeck = [];
    let currentIndex = 0;
    let masteryFilter = 'ALL'; // 'ALL', 'PRACTICE', 'MASTERED'
    let masteryState = JSON.parse(localStorage.getItem('jrotc_mastery_state') || '{}');

    // Quiz Mode State
    let quizQuestions = [];
    let currentQuizIndex = 0;
    let quizScore = 0;
    let selectedAnswer = false;

    // Load initial data and custom cards
    function initApp() {
      const customCards = JSON.parse(localStorage.getItem('jrotc_custom_cards') || '[]');
      allCards = [...initialCards, ...customCards];
      
      // Load Theme
      if (localStorage.getItem('jrotc_theme') === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
        const themeBtn = document.getElementById('themeToggleBtn');
        if (themeBtn) themeBtn.innerHTML = '<i class="fa-solid fa-sun"></i> <span>Day Mode</span>';
      }

      applyFilters();
      setupKeyboardControls();
    }

    function renderCard() {
      const cardEl = document.getElementById('flashcard');
      cardEl.classList.remove('is-flipped');

      if (currentDeck.length === 0) {
        document.getElementById('cardCategory').innerText = 'NO MATCH';
        document.getElementById('cardQuestion').innerHTML = 'No flashcards found matching your filter criteria.';
        document.getElementById('cardAnswer').innerHTML = 'Try selecting another section or clearing your search.';
        document.getElementById('cardCounter').innerText = 'Card 0 of 0';
        updateProgressBar(0, 0);
        return;
      }

      const card = currentDeck[currentIndex];
      document.getElementById('cardCategory').innerText = card.cat;
      document.getElementById('cardQuestion').innerHTML = card.q;
      document.getElementById('cardAnswer').innerHTML = card.a;
      document.getElementById('cardCounter').innerText = `Card ${currentIndex + 1} of ${currentDeck.length}`;

      updateMasteryButtons(card.id);
      updateMasteryStats();
      updateProgressBar(currentIndex + 1, currentDeck.length);
    }

    function flipCard() {
      const cardEl = document.getElementById('flashcard');
      cardEl.classList.toggle('is-flipped');
    }

    function nextCard() {
      if (currentDeck.length === 0) return;
      currentIndex = (currentIndex + 1) % currentDeck.length;
      renderCard();
    }

    function prevCard() {
      if (currentDeck.length === 0) return;
      currentIndex = (currentIndex - 1 + currentDeck.length) % currentDeck.length;
      renderCard();
    }

    function setCardStatus(isMastered) {
      if (currentDeck.length === 0) return;
      const card = currentDeck[currentIndex];
      masteryState[card.id] = isMastered ? 'mastered' : 'practice';
      localStorage.setItem('jrotc_mastery_state', JSON.stringify(masteryState));
      
      updateMasteryButtons(card.id);
      updateMasteryStats();

      // If active filter isolates practice or mastered, re-filter
      if (masteryFilter !== 'ALL') {
        applyFilters();
      } else {
        nextCard();
      }
    }

    function updateMasteryButtons(cardId) {
      const btnKnown = document.getElementById('btnKnown');
      const btnPractice = document.getElementById('btnPractice');
      const status = masteryState[cardId];

      btnKnown.classList.toggle('active', status === 'mastered');
      btnPractice.classList.toggle('active', status === 'practice');
    }

    function updateMasteryStats() {
      let masteredCount = 0;
      let practiceCount = 0;

      allCards.forEach(c => {
        if (masteryState[c.id] === 'mastered') masteredCount++;
        if (masteryState[c.id] === 'practice') practiceCount++;
      });

      document.getElementById('masteryStats').innerText = `Mastered: ${masteredCount} | Practice: ${practiceCount}`;
    }

    function updateProgressBar(current, total) {
      const percent = total > 0 ? (current / total) * 100 : 0;
      document.getElementById('progressBar').style.width = `${percent}%`;
    }

    function setMasteryFilter(filter) {
      masteryFilter = filter;
      document.getElementById('filterAll').classList.toggle('active', filter === 'ALL');
      document.getElementById('filterPractice').classList.toggle('active', filter === 'PRACTICE');
      document.getElementById('filterMastered').classList.toggle('active', filter === 'MASTERED');
      applyFilters();
    }

    function handleSearch() {
      applyFilters();
    }

    function applyFilters() {
      const sectionVal = document.getElementById('sectionSelect').value;
      const searchVal = document.getElementById('searchInput').value.toLowerCase().trim();

      currentDeck = allCards.filter(card => {
        // Section Filter
        let matchesSection = false;
        if (sectionVal === 'ALL') matchesSection = true;
        else if (sectionVal === 'CUSTOM') matchesSection = card.section === 'CUSTOM';
        else matchesSection = card.section === sectionVal;

        // Mastery Filter
        let matchesMastery = false;
        const status = masteryState[card.id];
        if (masteryFilter === 'ALL') matchesMastery = true;
        else if (masteryFilter === 'PRACTICE') matchesMastery = status === 'practice';
        else if (masteryFilter === 'MASTERED') matchesMastery = status === 'mastered';

        // Search Query
        const textContent = (card.q + ' ' + card.a + ' ' + card.cat).toLowerCase();
        const matchesSearch = searchVal === '' || textContent.includes(searchVal);

        return matchesSection && matchesMastery && matchesSearch;
      });

      currentIndex = 0;
      renderCard();
    }

    function shuffleCards() {
      for (let i = currentDeck.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [currentDeck[i], currentDeck[j]] = [currentDeck[j], currentDeck[i]];
      }
      currentIndex = 0;
      renderCard();
    }

    function resetDeck() {
      if (confirm("Are you sure you want to reset your study progress and filters?")) {
        masteryState = {};
        localStorage.removeItem('jrotc_mastery_state');
        document.getElementById('sectionSelect').value = 'ALL';
        document.getElementById('searchInput').value = '';
        masteryFilter = 'ALL';
        setMasteryFilter('ALL');
      }
    }

    function switchMode(mode) {
      document.getElementById('flashcardTabBtn').classList.toggle('active', mode === 'flashcard');
      document.getElementById('quizTabBtn').classList.toggle('active', mode === 'quiz');

      if (mode === 'flashcard') {
        document.getElementById('flashcardView').style.display = 'flex';
        document.getElementById('quizView').style.display = 'none';
        document.getElementById('flashcardPills').style.display = 'flex';
      } else {
        document.getElementById('flashcardView').style.display = 'none';
        document.getElementById('quizView').style.display = 'block';
        document.getElementById('flashcardPills').style.display = 'none';
        startQuiz();
      }
    }

    function startQuiz() {
      const availableCards = currentDeck.length > 3 ? currentDeck : allCards;
      const shuffled = [...availableCards].sort(() => 0.5 - Math.random());
      quizQuestions = shuffled.slice(0, Math.min(10, shuffled.length));
      
      currentQuizIndex = 0;
      quizScore = 0;
      renderQuizQuestion();
    }

    function renderQuizQuestion() {
      selectedAnswer = false;
      document.getElementById('nextQuizBtn').style.display = 'none';

      if (currentQuizIndex >= quizQuestions.length) {
        showQuizSummary();
        return;
      }

      const qCard = quizQuestions[currentQuizIndex];
      let options = [];

      if (qCard.distractors && qCard.distractors.length >= 3) {
        options = [qCard.a, ...qCard.distractors.slice(0, 3)];
      } else {
        const otherAnswers = allCards
          .filter(c => c.id !== qCard.id)
          .map(c => c.a.replace(/<[^>]*>?/gm, ''));
        const shuffledOthers = otherAnswers.sort(() => 0.5 - Math.random()).slice(0, 3);
        options = [qCard.a, ...shuffledOthers];
      }

      // Shuffle options
      options.sort(() => 0.5 - Math.random());

      let html = `
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
          <span class="category-tag">${qCard.cat}</span>
          <span style="font-weight:700; color:var(--text-muted); font-size:0.85rem;">Question ${currentQuizIndex + 1} of ${quizQuestions.length}</span>
        </div>
        <div class="quiz-question">${qCard.q}</div>
        <div class="options-grid">
      `;

      options.forEach(opt => {
        const cleanOpt = opt.replace(/"/g, '&quot;');
        const cleanCorrect = qCard.a.replace(/"/g, '&quot;');
        html += `<button class="option-btn" onclick="checkQuizAnswer(this, '${cleanOpt}', '${cleanCorrect}')">${opt}</button>`;
      });

      html += `</div>`;
      document.getElementById('quizContainer').innerHTML = html;
    }

    function checkQuizAnswer(btnEl, selectedOpt, correctOpt) {
      if (selectedAnswer) return;
      selectedAnswer = true;

      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach(btn => {
        btn.disabled = true;
        if (btn.innerText.trim() === correctOpt.replace(/<[^>]*>?/gm, '').trim()) {
          btn.classList.add('correct');
        }
      });

      if (selectedOpt.trim() === correctOpt.trim()) {
        quizScore++;
      } else {
        btnEl.classList.add('incorrect');
      }

      document.getElementById('nextQuizBtn').style.display = 'inline-flex';
    }

    function nextQuizQuestion() {
      currentQuizIndex++;
      renderQuizQuestion();
    }

    function showQuizSummary() {
      const percentage = Math.round((quizScore / quizQuestions.length) * 100);
      let rankTitle = "Cadet Private";
      if (percentage === 100) rankTitle = "Cadet Colonel (Board Master)";
      else if (percentage >= 85) rankTitle = "Cadet Major";
      else if (percentage >= 70) rankTitle = "Cadet Sergeant";
      else if (percentage >= 50) rankTitle = "Cadet Corporal";

      document.getElementById('quizContainer').innerHTML = `
        <div class="quiz-summary">
          <i class="fa-solid fa-award" style="font-size: 3.5rem; color: var(--army-gold);"></i>
          <h2 style="margin-top: 10px;">Board Examination Complete</h2>
          <div class="score-badge">${percentage}%</div>
          <div class="rank-title">Achieved Rank: ${rankTitle}</div>
          <p style="color: var(--text-muted); font-weight: 600; margin-bottom: 20px;">
            You correctly answered ${quizScore} out of ${quizQuestions.length} board questions.
          </p>
          <button class="btn-gold" onclick="startQuiz()" style="padding: 12px 24px; font-size: 1rem;">
            <i class="fa-solid fa-rotate-right"></i> Retake Board Exam
          </button>
        </div>
      `;
      document.getElementById('nextQuizBtn').style.display = 'none';
    }

    function speakCardText(face) {
      if (!('speechSynthesis' in window)) {
        alert("Text-to-speech is not supported in your browser.");
        return;
      }
      window.speechSynthesis.cancel();
      const card = currentDeck[currentIndex];
      if (!card) return;

      const rawText = face === 'front' ? card.q : card.a;
      // Strip HTML tags for smooth audio playback
      const cleanText = rawText.replace(/<[^>]*>?/gm, '');

      const utterance = new SpeechSynthesisUtterance(cleanText);
      utterance.rate = 0.95;
      window.speechSynthesis.speak(utterance);
    }

    function toggleTheme() {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      const themeBtn = document.getElementById('themeToggleBtn');

      if (isDark) {
        document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('jrotc_theme', 'light');
        themeBtn.innerHTML = '<i class="fa-solid fa-moon"></i> <span>Night Vision</span>';
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
        localStorage.setItem('jrotc_theme', 'dark');
        themeBtn.innerHTML = '<i class="fa-solid fa-sun"></i> <span>Day Mode</span>';
      }
    }

    function openAddModal() {
      document.getElementById('addCardModal').classList.add('open');
    }

    function closeAddModal() {
      document.getElementById('addCardModal').classList.remove('open');
    }

    function saveCustomCard(e) {
      e.preventDefault();
      const section = document.getElementById('newSectionSelect').value;
      const cat = document.getElementById('newCategory').value;
      const q = document.getElementById('newQuestion').value;
      const a = document.getElementById('newAnswer').value;

      const newCard = {
        id: "custom_" + Date.now(),
        section: section,
        cat: cat,
        q: q,
        a: a
      };

      const customCards = JSON.parse(localStorage.getItem('jrotc_custom_cards') || '[]');
      customCards.push(newCard);
      localStorage.setItem('jrotc_custom_cards', JSON.stringify(customCards));

      allCards.push(newCard);
      closeAddModal();
      
      // Reset Form
      document.getElementById('newCategory').value = '';
      document.getElementById('newQuestion').value = '';
      document.getElementById('newAnswer').value = '';

      applyFilters();
    }

    function setupKeyboardControls() {
      document.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;

        if (e.code === 'Space') {
          e.preventDefault();
          flipCard();
        } else if (e.code === 'ArrowRight') {
          nextCard();
        } else if (e.code === 'ArrowLeft') {
          prevCard();
        } else if (e.code === 'KeyK') {
          setCardStatus(true);
        } else if (e.code === 'KeyP') {
          setCardStatus(false);
        }
      });
    }

    // Initialize application when DOM is ready
    window.onload = initApp;
  </script>
